name: Refresh Direct/API Showtimes

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cinema-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-direct-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh direct/API showtimes without SerpAPI
        env:
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          PARIS_API_USERNAME: ${{ secrets.PARIS_API_USERNAME }}
          PARIS_API_PASSWORD: ${{ secrets.PARIS_API_PASSWORD }}
          PARIS_API_CLIENT_ID: ${{ secrets.PARIS_API_CLIENT_ID }}
        run: python scripts/refresh_direct_sources.py

      - name: Validate dataset
        run: python scripts/validate_dataset.py

      - name: Commit updated direct/API data
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "daniel@dannymora.com"
          git config --local user.name "Daniel Mora"
          git add public/data.json scripts/rating_cache.json
          if git diff --cached --quiet; then
            echo "No direct/API data changes to commit."
          else
            git commit -m "Refresh direct/API showtimes"
            for attempt in 1 2 3; do
              git fetch origin main
              if git merge -X ours origin/main 2>/dev/null; then
                true
              else
                git checkout --ours public/data.json scripts/rating_cache.json
                git add public/data.json scripts/rating_cache.json
                git commit -m "Merge origin/main (keeping local changes)"
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; retrying after remote update."
              sleep 5
            done
            echo "Failed to push direct/API data after 3 attempts."
            exit 1
          fi
