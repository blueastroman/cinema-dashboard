name: Refresh Recent Rotten Tomatoes Scores

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  refresh-rt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh recent RT scores
        shell: bash
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          AMC_FORCE_SERPAPI_FALLBACK: "1"
        run: |
          set -euo pipefail
          python scripts/scrape.py
          python scripts/validate_dataset.py

      - name: Commit updated RT data
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "daniel@dannymora.com"
          git config --local user.name "Daniel Mora"
          git add public/data.json scripts/rating_cache.json
          if git diff --cached --quiet; then
            echo "No RT refresh changes to commit."
          else
            git commit -m "Refresh recent Rotten Tomatoes scores"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; retrying after remote update."
              sleep 5
            done
            echo "Failed to push recent RT refresh after 3 attempts."
            exit 1
          fi
