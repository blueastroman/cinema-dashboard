name: Refresh Ratings for Recent Releases

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh ratings for movies released in last 30 days
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          set -euo pipefail
          python scripts/refresh_recent_ratings.py --release-days 30
          python scripts/validate_dataset.py

      - name: Commit updated ratings
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "daniel@dannymora.com"
          git config --local user.name "Daniel Mora"
          git add public/data.json scripts/rating_cache.json
          if git diff --cached --quiet; then
            echo "No rating changes to commit."
          else
            git commit -m "Refresh ratings for recently-released movies"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; retrying after remote update."
              sleep 5
            done
            echo "Failed to push rating updates after 3 attempts."
            exit 1
          fi
